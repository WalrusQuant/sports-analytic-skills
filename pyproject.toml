[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-ds"
version = "0.11.0"
description = "Sports data science toolkit: load, explore, model, validate, predict"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adam Wickwire" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "polars>=0.20",
  "pyarrow>=14.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "nflreadpy>=0.1.0",
]

[project.optional-dependencies]
multi = ["sportsdataverse>=0.0.40", "pybaseball>=2.2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
sports-ds = "sports_ds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
