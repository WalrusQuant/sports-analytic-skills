name: Live data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install all toolkit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,multi]"
      - name: Run live integrations
        env:
          SPORTS_DS_LIVE_TESTS: "1"
        run: python -m pytest -q -rs -m live -W error
